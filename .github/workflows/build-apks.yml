name: Build Sharqatna APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Create Android projects
        run: |
          cd apps/user && npx cap add android
          cd ../admin && npx cap add android
          cd ../..
          npm run android:sync
      - name: Apply Android permissions and branding
        run: node scripts/patch-android.mjs
      - name: Build both APKs
        run: |
          chmod +x apps/user/android/gradlew apps/admin/android/gradlew
          npm run build:user
          npm run build:admin
          mkdir -p dist
          cp apps/user/android/app/build/outputs/apk/debug/app-debug.apk dist/Sharqatna-User.apk
          cp apps/admin/android/app/build/outputs/apk/debug/app-debug.apk dist/Sharqatna-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sharqatna-Android-APKs
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error
